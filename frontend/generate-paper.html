<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/static/css/generate-paper.css" />
  </head>
  <body>
    <div class="app">
      <div class="main">
        <div class="topbar">
          <div class="topbar-title">Generate Question Paper</div>
          <div style="display: flex; align-items: center; gap: 10px">
            <div style="text-align: right">
              <div style="font-size: 13px; font-weight: 500; color: #111827">User</div>
              <div style="font-size: 11px; color: #6b7280">3rd Year Student</div>
            </div>
            <div class="avatar">ST</div>
          </div>
        </div>

        <div class="content">
          <!-- Step 1 -->
          <div id="step1">
            <div class="step-indicator">Step 1 of 3</div>
            <div class="step-title">Select a subject</div>
            <div class="progress-bar"><div class="progress-fill" style="width: 33%"></div></div>
            <div class="subject-grid" id="subjectGrid">
              <div class="subject-card selected" data-s="Operating Systems">
                <!-- <div class="subj-name">Operating Systems</div>
                <div class="subj-meta">4 units</div> -->
              </div>

              <div class="subject-card disabled" data-s="DBMS">
                <!-- <div class="subj-name">DBMS</div>
                <div class="subj-meta">Coming Soon</div> -->
              </div>

              <div class="subject-card disabled" data-s="Computer Networks">
                <!-- <div class="subj-name">Computer Networks</div>
                <div class="subj-meta">Coming Soon</div> -->
              </div>

              <div class="subject-card disabled" data-s="Java">
                <!-- <div class="subj-name">Java</div>
                <div class="subj-meta">Coming Soon</div> -->
              </div>

              <div class="subject-card disabled" data-s="Python">
                <!-- <div class="subj-name">Python</div>
                <div class="subj-meta">Coming Soon</div> -->
              </div>

              <div class="subject-card disabled" data-s="Software Engineering">
                <!-- <div class="subj-name">Software Engineering</div>
                <div class="subj-meta">Coming Soon</div> -->
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-primary" onclick="goStep(2)">
                Continue <i class="ti ti-arrow-right" aria-hidden="true"></i>
              </button>
            </div>
          </div>

          <!-- Step 2 -->

          <div class="topic-item">
            <!-- Step 2 -->
             <!-- Step 2 -->
<div id="step2" class="hidden">
  <div class="step-indicator">Step 2 of 3</div>

  <div class="step-title">
    Select units / topics —
    <span id="subjectLabel"></span>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" style="width:66%"></div>
  </div>

  <div id="unitContainer"></div>

  <div class="btn-row" style="margin-top:1.25rem">
    <button class="btn btn-ghost" onclick="goStep(1)">
      Back
    </button>

    <button class="btn btn-primary" onclick="goStep(3)">
      Continue
    </button>
  </div>
</div>
            
          <!-- Step 3 -->
          <div id="step3" class="hidden">
            <div class="step-indicator">Step 3 of 3</div>
            <div class="step-title">Paper settings</div>
            <div class="progress-bar"><div class="progress-fill" style="width: 100%"></div></div>
            <div
              id="selectedSummary"
              style="font-size: 13px; font-weight: 500; color: #6b7280; margin-bottom: 6px"
            ></div>
            <div class="tags-row" id="selectedTopics"></div>
            <div class="settings-grid">
              <div class="setting-group">
                <label>Exam type</label>
                <select>
                  <option>Sessional Exam</option>
                  <option>End Semester</option>
                  <option>Quiz</option>
                  <option>Practice Test</option>
                </select>
              </div>
              <div class="setting-group">
                <label>Difficulty</label>
                <select id="difficulty">
                  <option>Mixed</option>
                  <option>Easy</option>
                  <option>Medium</option>
                  <option>Hard</option>
                </select>
              </div>
              <div class="setting-group">
                <label>Total marks</label>
                <input id="marks" type="number" value="30" min="10" max="100" />
              </div>
              <div class="setting-group">
                <label>Time duration</label>
                <select>
                  <option>1 Hour</option>
                  <option>1.5 Hours</option>
                  <option>2 Hours</option>
                  <option>3 Hours</option>
                </select>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn-ghost" onclick="goStep(2)">
                <i class="ti ti-arrow-left" aria-hidden="true"></i> Back
              </button>

              <button class="btn btn-primary" onclick="generatePaper()">
                <i class="ti ti-sparkles" aria-hidden="true"></i> Generate Paper
              </button>
            </div>
          </div>

          <!-- Step 4 -->
          <div id="step4" class="hidden">
            <div class="step-indicator">Generated Paper</div>
            <div class="step-title">Sessional Question Paper</div>

            <div class="result-box">
              <pre id="generatedPaper">

Loading...

        </pre
              >
            </div>
            
            <!-- <div class="result-box error">
              <p class="error-msg">
                <i
                  class="ti ti-alert-circle"
                  aria-hidden="true"
                  style="vertical-align: -2px; margin-right: 6px"
                ></i
                >Could not connect to generation API. Check your connection and try again.
              </p>
            </div> -->
            <div class="btn-row" style="margin-top: 1.25rem">
              <button class="btn btn-ghost" onclick="goStep(1)">New Paper</button>
              <!-- <button
            class="btn btn-primary"
            onclick="downloadPaper()">
            Download PDF
        </button> -->
              <button
    class="btn btn-primary"
    onclick="downloadPaper()"
>
    <i class="ti ti-download" aria-hidden="true"></i>
    Download
</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="/static/js/generate-paper.js"></script>
  </body>
</html>
